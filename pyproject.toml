[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "aigentics-backend"
version = "0.1.0"
description = "Multi-tenant backend for an enterprise AI workforce SaaS platform."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Aigentics" },
]
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "boto3>=1.35.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "google-genai>=1.68.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-ai>=0.0.24",
  "pydantic-settings>=2.7.0",
  "pymysql>=1.1.1",
  "PyJWT>=2.10.0",
  "pwdlib>=0.2.1",
  "python-multipart>=0.0.18",
  "python-socketio>=5.11.4",
  "PyYAML>=6.0.2",
  "qdrant-client>=1.12.1",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4"]
ignore = ["B008", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
